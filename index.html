<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VHS Trace</title>
<meta name="description" content="VHS Trace. Coming soon.">
<style>
  :root { --bg: #0b0b10; --fg: #e8e6e3; --dim: #8a8794; --r: #ff3b5c; --g: #2affc4; --b: #4d7cff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: grid; place-items: center; padding: 16px; overflow: hidden;
  }
  body::before { /* scanlines */
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.35) 2px 4px);
  }
  body::after { /* tracking band */
    content: ""; position: fixed; left: 0; right: 0; height: 14vh; top: -20vh; pointer-events: none;
    background: linear-gradient(transparent, rgba(255,255,255,.06), transparent);
    animation: track 7s linear infinite;
  }
  @keyframes track { to { top: 120vh; } }
  main { text-align: center; position: relative; }
  .osd { color: var(--g); font-size: clamp(12px, 2.5vw, 16px); letter-spacing: .2em; margin-bottom: 1.5rem; }
  .osd span { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  h1 {
    font-size: clamp(40px, 12vw, 120px); letter-spacing: .08em; line-height: 1;
    text-shadow: -3px 0 var(--r), 3px 0 var(--b);
  }
  p { color: var(--dim); margin-top: 1.5rem; font-size: clamp(13px, 2.8vw, 17px); }
  @media (prefers-reduced-motion: reduce) { body::after, .osd span { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="osd"><span>&#9654;</span> PLAY &nbsp; SP &nbsp; 0:00:00</div>
  <h1>VHS TRACE</h1>
  <p>Coming soon.</p>
</main>
</body>
</html>
